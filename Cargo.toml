[workspace]
resolver = "2"
members = ["crates/models", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Teamfliyou/toeic-reading-ai-coach"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
regex = "1"
unicode-normalization = "0.1"
