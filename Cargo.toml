[workspace]
resolver = "2"
members = ["crates/models", "crates/core", "crates/bank", "crates/database", "crates/ai", "crates/security", "crates/server", "crates/ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Teamfliyou/toeic-reading-ai-coach"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
axum = "0.8"
scrypt = { version = "0.11", default-features = false }
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
getrandom = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package.scrypt]
opt-level = 3
