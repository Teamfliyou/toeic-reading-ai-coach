name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Les tests importent des modules TypeScript : Node >= 22.18 requis.
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      - name: Typage (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Validation des données
        run: npm run check:data

      - name: Build
        run: npm run build
