[package]
name = "lernoviq-ui"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
lernoviq-core = { path = "../core" }
lernoviq-models = { path = "../models" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Performance", "Location"] }
